# Render: the backend API on the free plan (docs/16-DESPLIEGUE.md). The service is created by
# hand from the Render dashboard; this file records the same settings for reference and can
# also be used as a Blueprint. The frontend is hosted on Cloudflare Pages, the database on
# Neon, and offers are synced by .github/workflows/sync-jobs.yml (a free service sleeps).
services:
  - type: web
    name: techmatch-api
    runtime: node
    plan: free
    branch: main
    # Deploy only after the GitHub Actions CI passes on main.
    autoDeployTrigger: checksPass
    buildCommand: npm ci --include=dev && npm run build -w backend
    # Migrations are idempotent: applying them on every start keeps the schema up to date.
    startCommand: node backend/dist/main/migrate.js && node backend/dist/main/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      # The Cloudflare Pages URL of the frontend, e.g. https://techmatch.pages.dev
      - key: CORS_ORIGIN
        sync: false
      - key: CV_STORAGE_DIR
        value: /tmp/techmatch-cvs
      - key: JOB_SYNC_ENABLED
        value: 'false'
      - key: LOG_LEVEL
        value: info
