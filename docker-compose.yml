services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: techmatch
      POSTGRES_PASSWORD: techmatch
      POSTGRES_DB: techmatch
    ports:
      - '${DB_PORT:-5434}:5432'
    volumes:
      - techmatch-db:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U techmatch']
      interval: 5s
      timeout: 3s
      retries: 10

  # Development SMTP server: catches every email the backend sends (nothing leaves the machine).
  # Web UI with the inbox: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '${SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'

volumes:
  techmatch-db:
